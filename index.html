<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Full-Stack Developer & Blockchain Engineer - Portfolio Website"
    />

    <meta name="theme-color" content="#070808" />

    <link
      id="favicon"
      rel="icon"
      type="image/svg+xml"
      href="/favicon-dark.svg"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <script>
      try {
        const theme = localStorage.getItem("theme") || "dark";

        document.getElementById("favicon").href =
          theme === "light" ? "/favicon-light.svg" : "/favicon-dark.svg";
      } catch {}
    </script>

    <title>Anish K - Full-Stack Developer & Blockchain Engineer</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
